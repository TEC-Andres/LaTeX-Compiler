name: Repo Structure Check

on: [push]

jobs:
  check-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify top-level structure
        run: |
          tree -d -L 1 --charset utf-8
          expected=".git
          .github
          .gitignore
          README.md
          assets
          requirements.txt
          src
          tests"
          actual="$(ls -A1 | sort)"
          diff <(echo "$expected") <(echo "$actual") || {
            echo -e "\033[31mRepository structure has changed!\033[0m"
            exit 1
          }
